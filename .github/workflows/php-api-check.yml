name: PHP API Foundation Check

on:
  push:
    branches:
      - feature/backend-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Syntax check PHP entry point
        run: php -l backend/public/index.php
      - name: Verify required backend files exist
        run: |
          test -f backend/README.md
          test -f backend/database/schema.sql
          test -f backend/.env.example
          test -f backend/public/.htaccess
